<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
    
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151526"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>

    <linearGradient id="edgeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#grid)" />
  
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="url(#edgeTop)" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#plateGrad)"/>
    <rect x="76" y="76" width="360" height="360" rx="80" fill="none" stroke="url(#edgeTop)" stroke-width="2"/>
  </g>

  <g filter="url(#glow)" transform="rotate(-8 256 256)">
    <rect x="156" y="160" width="36" height="192" rx="18" fill="url(#neon)"/>
    <rect x="156" y="160" width="90" height="36" rx="18" fill="url(#neon)"/>
    <rect x="156" y="238" width="70" height="36" rx="18" fill="url(#neon)"/>

    <rect x="266" y="160" width="36" height="192" rx="18" fill="url(#neon)"/>
    <rect x="266" y="160" width="90" height="36" rx="18" fill="url(#neon)"/>
    <rect x="320" y="160" width="36" height="114" rx="18" fill="url(#neon)"/>
    <rect x="266" y="238" width="90" height="36" rx="18" fill="url(#neon)"/>
  </g>

  <path d="M 76 280 C 180 200, 320 340, 436 240 L 436 156 A 80 80 0 0 0 356 76 L 156 76 A 80 80 0 0 0 76 156 Z" fill="url(#glass)"/>
  
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="8"/>
</svg>
